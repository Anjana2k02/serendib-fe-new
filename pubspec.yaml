name: serendib
description: A Flutter mobile application with brown and off-white theme
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Secure Storage for tokens
  flutter_secure_storage: ^9.0.0

  # HTTP requests (for future API integration)
  http: ^1.1.0
  http_parser: ^4.0.0

  # QR Code Scanner
  mobile_scanner: ^5.1.1

  # Image Picker (for artifact classification)
  image_picker: ^1.0.7

  # Icons
  cupertino_icons: ^1.0.2

  # Permissions
  permission_handler: ^11.1.0

  # URL Launcher (for contact screen)
  url_launcher: ^6.2.4

  # Audio Playback (for artifact audio)
  audioplayers: ^6.0.0

  # SVG rendering for indoor maps
  flutter_svg: ^2.0.10

  # Vector math for map transformations
  vector_math: ^2.1.4

  # Collection utilities for pathfinding
  collection: ^1.18.0

  # Google Sign-In for OAuth2 authentication
  google_sign_in: ^6.1.5

  # Firebase Core (required by generated firebase_options.dart)
  firebase_core: ^3.15.2

  # 3d controller
  flutter_3d_controller: ^2.3.0

  # Sensor access (accelerometer, gyroscope)
  sensors_plus: ^5.0.0

  # WebSocket communication
  web_socket_channel: ^2.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/maps/
    - assets/map-routes/
    - assets/artifacts/
    - assets/artifacts/base_data/
    - assets/artifacts/base_images/
    - assets/user/

  # Add custom fonts here if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
